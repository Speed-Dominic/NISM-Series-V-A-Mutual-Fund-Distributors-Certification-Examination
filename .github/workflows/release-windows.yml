
name: Build and Release NISM Windows App

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm install

      - name: Install Electron and Builder
        run: npm install --no-save electron electron-builder

      - name: Build React application
        run: npm run build

      - name: Build Windows installer and portable EXE
        run: npx electron-builder --win nsis portable

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: NISM Exam Prep Studio v1.0.${{ github.run_number }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            release/*.exe
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
